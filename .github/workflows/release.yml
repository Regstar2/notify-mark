name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release version, for example v0.10.1-beta.1
        required: true
        type: string
      publish:
        description: Publish GitHub Release after a successful build
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    if: >-
      github.actor == 'Regstar2' &&
      github.triggering_actor == 'Regstar2'
    runs-on:
      - self-hosted
      - Windows
      - X64
    timeout-minutes: 120

    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      PUBLISH_RELEASE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
      NOTIFYMARK_RELEASE_STORE_PASSWORD: ${{ secrets.NOTIFYMARK_RELEASE_STORE_PASSWORD }}
      NOTIFYMARK_RELEASE_KEY_ALIAS: ${{ secrets.NOTIFYMARK_RELEASE_KEY_ALIAS }}
      NOTIFYMARK_RELEASE_KEY_PASSWORD: ${{ secrets.NOTIFYMARK_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release source
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG

          if ([string]::IsNullOrWhiteSpace($tag)) {
              throw 'Release tag is empty.'
          }

          if ($tag -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
              throw "Invalid release tag: $tag"
          }

          if ($env:PUBLISH_RELEASE -eq 'true') {
              git fetch --tags --force
              if ($LASTEXITCODE -ne 0) {
                  throw 'git fetch --tags failed.'
              }

              git rev-parse "refs/tags/$tag^{commit}" *> $null
              if ($LASTEXITCODE -ne 0) {
                  throw "Tag '$tag' does not exist."
              }

              git checkout --detach "refs/tags/$tag"
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to checkout tag '$tag'."
              }

              Write-Host "Publishing exact tag $tag at $(git rev-parse HEAD)."
          }
          else {
              Write-Host "Dry-run: validating checked-out source $(git rev-parse HEAD) as $tag without creating a GitHub Release."
          }

      - name: Validate prepared release notes
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $requiredNotes = @(
              "./docs/releases/$tag.md",
              "./docs/releases/${tag}_EN.md"
          )

          foreach ($path in $requiredNotes) {
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Prepared release notes are missing: $path"
              }

              if (-not (Select-String -LiteralPath $path -SimpleMatch $tag -Quiet)) {
                  throw "Release notes do not reference release tag '$tag': $path"
              }
          }

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK 35
        shell: pwsh
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          if ($LASTEXITCODE -ne 0) {
              throw 'Failed to install Android SDK 35 and Build Tools 35.0.0.'
          }

      - name: Materialize release keystore
        shell: pwsh
        env:
          NOTIFYMARK_RELEASE_KEYSTORE_BASE64: ${{ secrets.NOTIFYMARK_RELEASE_KEYSTORE_BASE64 }}
        run: |
          $required = @{
              NOTIFYMARK_RELEASE_KEYSTORE_BASE64 = $env:NOTIFYMARK_RELEASE_KEYSTORE_BASE64
              NOTIFYMARK_RELEASE_STORE_PASSWORD = $env:NOTIFYMARK_RELEASE_STORE_PASSWORD
              NOTIFYMARK_RELEASE_KEY_ALIAS = $env:NOTIFYMARK_RELEASE_KEY_ALIAS
              NOTIFYMARK_RELEASE_KEY_PASSWORD = $env:NOTIFYMARK_RELEASE_KEY_PASSWORD
          }

          foreach ($entry in $required.GetEnumerator()) {
              if ([string]::IsNullOrWhiteSpace([string]$entry.Value)) {
                  throw "Required release secret '$($entry.Key)' is not configured."
              }
          }

          $keystorePath = Join-Path $env:RUNNER_TEMP 'notify-mark-release.jks'

          try {
              $bytes = [Convert]::FromBase64String($env:NOTIFYMARK_RELEASE_KEYSTORE_BASE64)
              [IO.File]::WriteAllBytes($keystorePath, $bytes)
          }
          catch {
              throw 'NOTIFYMARK_RELEASE_KEYSTORE_BASE64 is not valid Base64 keystore data.'
          }

          if (-not (Test-Path -LiteralPath $keystorePath -PathType Leaf)) {
              throw 'Failed to materialize release keystore.'
          }

          "NOTIFYMARK_RELEASE_STORE_FILE=$keystorePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run release-source CI
        shell: pwsh
        run: ./scripts/ci.ps1

      - name: Prepare release output
        shell: pwsh
        run: |
          if (Test-Path './dist') {
              Remove-Item './dist' -Recurse -Force
          }

          New-Item -ItemType Directory -Path './dist' | Out-Null

      - name: Build release artifacts
        shell: pwsh
        run: ./scripts/release.ps1 -Version $env:RELEASE_TAG

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $files = @(Get-ChildItem './dist' -File)

          if ($files.Count -ne 2) {
              throw "Expected exactly APK and SHA-256 files in dist/, found $($files.Count)."
          }

          $apk = @($files | Where-Object { $_.Extension -eq '.apk' })
          $checksum = @($files | Where-Object { $_.Name -like '*.apk.sha256' })

          if ($apk.Count -ne 1 -or $checksum.Count -ne 1) {
              throw 'dist/ must contain one release APK and one .apk.sha256 checksum file.'
          }

          if ($apk[0].Name -match '(?i)debug') {
              throw 'Debug APK cannot be published as a release artifact.'
          }

          $expectedHash = ((Get-Content -LiteralPath $checksum[0].FullName -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actualHash = (Get-FileHash -LiteralPath $apk[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($expectedHash -ne $actualHash) {
              throw 'Release APK SHA-256 does not match the generated checksum file.'
          }

      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: notify-mark-${{ env.RELEASE_TAG }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ env.PUBLISH_RELEASE == 'true' }}
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
              throw "GitHub Release '$env:RELEASE_TAG' already exists."
          }

          $files = @(Get-ChildItem './dist' -File)
          $apk = @($files | Where-Object { $_.Extension -eq '.apk' })
          $checksum = @($files | Where-Object { $_.Name -like '*.apk.sha256' })

          if ($apk.Count -ne 1 -or $checksum.Count -ne 1) {
              throw 'Release publication requires exactly one APK and one .apk.sha256 file.'
          }

          $hash = ((Get-Content -LiteralPath $checksum[0].FullName -Raw).Trim() -split '\\s+')[0].ToLowerInvariant()
          $actualHash = (Get-FileHash -LiteralPath $apk[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $actualHash) {
              throw 'Release checksum changed after artifact verification.'
          }

          $tag = $env:RELEASE_TAG
          $repo = $env:GITHUB_REPOSITORY
          $ruNotesUrl = "https://github.com/$repo/blob/$tag/docs/releases/$tag.md"
          $enNotesUrl = "https://github.com/$repo/blob/$tag/docs/releases/${tag}_EN.md"
          $issuesUrl = "https://github.com/$repo/issues"

          $releaseBody = @(
              "# NotifyMark $tag",
              "",
              "Signed Android release built from the exact tag after project CI, security audit, signature verification, and checksum validation.",
              "",
              "[Полное описание на русском]($ruNotesUrl) · [Full release notes in English]($enNotesUrl)",
              "",
              "## Установка / Installation",
              "",
              "- APK: $($apk[0].Name)",
              "- SHA-256 file: $($checksum[0].Name)",
              "- SHA-256: $hash",
              "- Verify the checksum before installation.",
              "",
              "## Проверено / Verification",
              "",
              "- project CI passed on the release source;",
              "- signed release APK build passed;",
              "- security audit passed;",
              "- apksigner verification passed;",
              "- APK SHA-256 matches the published checksum file.",
              "",
              "## Ограничения / Limitations",
              "",
              "This release follows the limitations documented in the full release notes. Prerelease versions are not presented as stable.",
              "",
              "## Feedback",
              "",
              "Bug reports and feature requests: $issuesUrl"
          ) -join [Environment]::NewLine

          $notesPath = Join-Path $env:RUNNER_TEMP "notify-mark-$tag-release-notes.md"
          $releaseBody | Set-Content -LiteralPath $notesPath -Encoding utf8

          $assetPaths = @($files | Select-Object -ExpandProperty FullName)
          $arguments = @(
              'release', 'create', $tag
          )
          $arguments += $assetPaths
          $arguments += @(
              '--verify-tag',
              '--title', "NotifyMark $tag",
              '--notes-file', $notesPath
          )

          if ($tag -match '-(alpha|beta|rc)(\\.|$)') {
              $arguments += @('--prerelease', '--latest=false')
          }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to create GitHub Release '$tag'."
          }

      - name: Remove temporary keystore
        if: ${{ always() }}
        shell: pwsh
        run: |
          $keystorePath = Join-Path $env:RUNNER_TEMP 'notify-mark-release.jks'
          if (Test-Path -LiteralPath $keystorePath) {
              Remove-Item -LiteralPath $keystorePath -Force
          }
