name: Предложить улучшение / Feature request
description: Предложить улучшение NotifyMark / Suggest a NotifyMark improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Проблема / Problem
      description: Какое реальное ограничение или неудобство нужно решить? / What concrete limitation or pain point should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Желаемое поведение / Desired behavior
      description: Опишите результат для пользователя; конкретная реализация не обязательна. / Describe the user result; a specific implementation is optional.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Обходные пути / Workarounds
      description: Что вы используете сейчас? / What do you use today?
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Версия / Version
      placeholder: v0.10.1-beta.1
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка приватности / Privacy check
      options:
        - label: Запрос не содержит приватных заметок, токенов, паролей или других чувствительных данных. / The request contains no private notes, tokens, passwords, or other sensitive data.
          required: true
