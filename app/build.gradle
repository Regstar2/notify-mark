plugins {
    id "com.android.application"
}

def releaseSigning = [
        storeFile    : System.getenv("NOTIFYMARK_RELEASE_STORE_FILE"),
        storePassword: System.getenv("NOTIFYMARK_RELEASE_STORE_PASSWORD"),
        keyAlias     : System.getenv("NOTIFYMARK_RELEASE_KEY_ALIAS"),
        keyPassword  : System.getenv("NOTIFYMARK_RELEASE_KEY_PASSWORD")
]
def hasReleaseSigningValue = { value ->
    value != null && !value.trim().isEmpty()
}
def releaseSigningConfigured = releaseSigning.values().every(hasReleaseSigningValue)

android {
    namespace "com.regstar.obsidiannotification"
    compileSdk 35

    defaultConfig {
        applicationId "com.regstar.obsidiannotification"
        minSdk 26
        targetSdk 35
        versionCode 26
        versionName "0.10.1-beta.1"
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.core:core:1.13.0"
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation "com.google.android.material:material:1.12.0"
    testImplementation "junit:junit:4.13.2"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

gradle.taskGraph.whenReady { taskGraph ->
    boolean releaseArtifactRequested = taskGraph.allTasks.any { task ->
        task.project == project &&
                task.name ==~ /(?i)(assemble|bundle|package|install).*release.*/
    }

    if (releaseArtifactRequested) {
        if (!releaseSigningConfigured) {
            throw new GradleException(
                    "Release signing is not configured. Set NOTIFYMARK_RELEASE_STORE_FILE, " +
                            "NOTIFYMARK_RELEASE_STORE_PASSWORD, NOTIFYMARK_RELEASE_KEY_ALIAS and " +
                            "NOTIFYMARK_RELEASE_KEY_PASSWORD."
            )
        }

        if (!file(releaseSigning.storeFile).isFile()) {
            throw new GradleException("Configured NotifyMark release keystore file does not exist.")
        }
    }
}
